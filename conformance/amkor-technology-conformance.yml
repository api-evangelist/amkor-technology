domain_standards:
  - id: rosettanet-pip
    name: RosettaNet Partner Interface Processes (PIPs)
    conforms: true
    where: >-
      Named under "Message Formats" on the B2B Integration Services page as a supported message
      format for customer-to-Amkor manufacturing data exchange.
    evidence:
      url: https://amkor.com/b2b-integration-services-solutions/
      quote: 'Message formats: RosettaNet PIPs, delimited flat files, EDI, XML, EDI/EDIFACT, Excel, and text-based reports.'
      note: >-
        Individual PIP numbers are NOT published on the public page; the PIP set is established during
        commercial onboarding. Recorded as conforming at the family level only.
  - id: rosettanet-rnif
    name: RosettaNet Implementation Framework (RNIF)
    conforms: true
    where: Named under "Delivery Protocols" on the B2B Integration Services page.
    evidence:
      url: https://amkor.com/b2b-integration-services-solutions/
      quote: 'Delivery protocols: RosettaNet RNIF, File Transfer Protocol (FTP/SFTP), EDI (VAN and AS2), SOAP Web Services (HTTPS), MQ, JMS, Encryption and various third-party suppliers.'
  - id: edi-x12-edifact
    name: EDI (ANSI X12 / UN-EDIFACT)
    conforms: true
    where: Named as both a delivery protocol (EDI over VAN and AS2) and a message format (EDI, EDI/EDIFACT).
    evidence:
      url: https://amkor.com/b2b-integration-services-solutions/
      note: >-
        This is the domain-standard signature for an OSAT/electronics supply-chain provider: a customer
        already speaking X12/EDIFACT integrates without a bespoke connector. Transaction categories named
        on the page are lot status and transactions, shipping and billing information, customer purchase
        orders, and build instructions.
  - id: as2
    name: AS2 (RFC 4130) EDI over HTTP
    conforms: true
    where: Named as an EDI delivery protocol alongside VAN.
    evidence:
      url: https://amkor.com/b2b-integration-services-solutions/
  - id: soap-web-services
    name: SOAP Web Services over HTTPS
    conforms: true
    where: Named as a delivery protocol.
    evidence:
      url: https://amkor.com/b2b-integration-services-solutions/
      note: >-
        No WSDL is published anywhere public. Probed https://amkor.com/?wsdl (200, but the WordPress
        homepage, not a WSDL), https://api.amkor.com/?wsdl (403 Imperva) and
        https://api.amkor.com/services?wsdl (403 Imperva). The SOAP contract is provisioned per customer
        under a commercial agreement, so no wsdl/ artifact was written.
notes:
  - >-
    Amkor's integration surface is real but partner-gated: the protocols and formats are published,
    the endpoints, WSDLs, PIP numbers and credentials are not. Nothing was fabricated to fill the gap.
