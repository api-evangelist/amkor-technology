description: >-
  Standards and certification conformance for Amkor Technology. Amkor publishes no web API, so none
  of the usual API-layer conformance targets (OAuth 2.0, OIDC, RFC 9457, JSON:API, OData) apply.
  What Amkor does publish, and what is captured here, is (a) a large, factory-by-factory certification
  set on its Quality page, and (b) a named B2B integration standards stack on its B2B Integration
  Services page — the machine-to-machine contract this company actually ships to customers.
