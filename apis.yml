  - aid: amkor-technology:b2b-integration
    name: Amkor B2B Integration Services
    tags:
      - B2B Integration
      - EDI
      - RosettaNet
      - Supply Chain
      - Semiconductor Packaging
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://amkor.com/b2b-integration-services-solutions/
    properties:
      - type: Documentation
        url: https://amkor.com/b2b-integration-services-solutions/
      - type: Conformance
        url: conformance/amkor-technology-conformance.yml
    description: >-
      Amkor's centralized B2B infrastructure for exchanging manufacturing information between its
      factories, sales teams and customers. Delivery protocols published by Amkor are RosettaNet RNIF,
      FTP/SFTP, EDI over VAN and AS2, SOAP Web Services over HTTPS, MQ and JMS; message formats are
      RosettaNet PIPs, delimited flat files, EDI, XML, EDI/EDIFACT, Excel and text reports. Transaction
      categories are lot status and transactions, shipping and billing information, customer purchase
      orders and build instructions. NO baseURL is recorded because Amkor publishes no endpoint, WSDL
      or PIP list: connectivity, certificates and credentials are provisioned per customer during
      commercial onboarding, so the surface is real but partner-gated.
